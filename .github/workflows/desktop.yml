name: Desktop builds

on:
  workflow_call:
    inputs:
      release:
        type: boolean
        default: false
    secrets:
      MAC_CSC_LINK:
        required: false
      MAC_CSC_KEY_PASSWORD:
        required: false
      APPLE_API_KEY_P8:
        required: false
      APPLE_API_KEY_ID:
        required: false
      APPLE_API_ISSUER:
        required: false
      WIN_CSC_LINK:
        required: false
      WIN_CSC_KEY_PASSWORD:
        required: false

permissions:
  contents: read

jobs:
  build:
    name: ${{ matrix.platform }}-${{ matrix.arch }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: macos-15, platform: mac, arch: arm64 }
          - { os: macos-15-intel, platform: mac, arch: x64 }
          - { os: windows-2025, platform: windows, arch: x64 }
          - { os: windows-11-arm, platform: windows, arch: arm64 }
          - { os: ubuntu-24.04, platform: linux, arch: x64 }
          - { os: ubuntu-24.04-arm, platform: linux, arch: arm64 }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          architecture: ${{ matrix.arch }}
          cache: npm
      - name: Install Linux packaging tools
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y rpm dpkg-dev binutils
      - run: npm ci
      - name: Test host and client protocols
        if: runner.os == 'Linux'
        run: npm test
      - run: npm run build
      - name: Test browser renderer hydration
        if: runner.os == 'Linux'
        run: node --import tsx tests/browser-renderer-smoke.ts
      - name: Test native display sessions with a fake Mac host
        if: runner.os == 'Linux'
        run: node --import tsx tests/native-session-smoke.ts
      - name: Package (sign only on release builds when enabled)
        run: node scripts/package-desktop.mjs ${{ matrix.platform }} ${{ matrix.arch }}
        env:
          SIM_RELAY_RELEASE: ${{ inputs.release }}
          MACOS_SIGNING_ENABLED: ${{ vars.MACOS_SIGNING_ENABLED }}
          WINDOWS_SIGNING_ENABLED: ${{ vars.WINDOWS_SIGNING_ENABLED }}
          CSC_LINK: ${{ inputs.release && (matrix.platform == 'mac' && secrets.MAC_CSC_LINK || matrix.platform == 'windows' && secrets.WIN_CSC_LINK) || '' }}
          CSC_KEY_PASSWORD: ${{ inputs.release && (matrix.platform == 'mac' && secrets.MAC_CSC_KEY_PASSWORD || matrix.platform == 'windows' && secrets.WIN_CSC_KEY_PASSWORD) || '' }}
          APPLE_API_KEY_P8: ${{ inputs.release && matrix.platform == 'mac' && secrets.APPLE_API_KEY_P8 || '' }}
          APPLE_API_KEY_ID: ${{ inputs.release && matrix.platform == 'mac' && secrets.APPLE_API_KEY_ID || '' }}
          APPLE_API_ISSUER: ${{ inputs.release && matrix.platform == 'mac' && secrets.APPLE_API_ISSUER || '' }}
      - name: Verify Linux package metadata and payload
        if: runner.os == 'Linux'
        run: node scripts/check-linux-packages.mjs
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: desktop-${{ matrix.platform }}-${{ matrix.arch }}
          if-no-files-found: error
          retention-days: 7
          path: |
            release/Sim-Relay-*.AppImage
            release/Sim-Relay-*.tar.gz
            release/Sim-Relay-*.deb
            release/Sim-Relay-*.rpm
            release/Sim-Relay-*.exe
            release/Sim-Relay-*.dmg
            release/Sim-Relay-*.zip

  nix:
    name: Nix flake
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: cachix/install-nix-action@448cde739abec1eaf0646249e3d25bb8d9bc7702 # v31.11.2
      - run: nix run --inputs-from . nixpkgs#actionlint
      - run: nix flake check --all-systems --no-build
      - run: nix build --no-link
