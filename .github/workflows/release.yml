name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: read

# Never cancel a release after it has started publishing.
concurrency:
  group: release
  cancel-in-progress: false

jobs:
  version:
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.version.outputs.version }}
      prerelease: ${{ steps.version.outputs.prerelease }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      - id: version
        run: node scripts/release.mjs validate
        env:
          RELEASE_TAG: ${{ github.ref_name }}

  build:
    needs: version
    uses: ./.github/workflows/desktop.yml
    with:
      release: true
    secrets: inherit

  publish:
    needs: [version, build]
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: desktop-*
          merge-multiple: true
          path: installers
      - name: Validate all installers and generate checksums and Homebrew cask
        run: node scripts/release.mjs assemble installers release-assets release-notes.md
        env:
          MACOS_SIGNING_ENABLED: ${{ vars.MACOS_SIGNING_ENABLED }}
          WINDOWS_SIGNING_ENABLED: ${{ vars.WINDOWS_SIGNING_ENABLED }}
      - name: Save stable Homebrew cask for the tap job
        if: needs.version.outputs.prerelease == 'false'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: homebrew-cask
          path: release-assets/sim-relay.rb
          if-no-files-found: error

      - name: Publish complete release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
          PRERELEASE: ${{ needs.version.outputs.prerelease }}
        run: |
          set -euo pipefail
          # A failed upload leaves a draft. Never replace a published release.
          if gh release view "$RELEASE_TAG" --json isDraft --jq .isDraft > existing-release.txt; then
            test "$(cat existing-release.txt)" = true
          else
            gh release create "$RELEASE_TAG" --verify-tag --draft --title "Sim Relay $RELEASE_TAG" --notes-file release-notes.md --generate-notes
          fi
          gh release upload "$RELEASE_TAG" release-assets/* --clobber
          if test "$PRERELEASE" = true; then
            gh release edit "$RELEASE_TAG" --draft=false --prerelease --latest=false
          else
            gh release edit "$RELEASE_TAG" --draft=false --prerelease=false --latest
          fi

  homebrew:
    needs: [version, publish]
    if: needs.version.outputs.prerelease == 'false'
    runs-on: macos-15
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.repository.default_branch }}
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: homebrew-cask
          path: generated-cask
      - run: ruby -c generated-cask/sim-relay.rb
      - name: Update this repository's Homebrew tap
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          RELEASE_VERSION: ${{ needs.version.outputs.version }}
          HOMEBREW_NO_AUTO_UPDATE: '1'
        run: |
          set -euo pipefail
          node scripts/release.mjs update-tap generated-cask/sim-relay.rb
          git add Casks/sim-relay.rb
          if ! git diff --cached --quiet; then
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git commit -m "chore(homebrew): update Sim Relay to $RELEASE_VERSION"
            # Homebrew requires casks to live in a tap. Validate a temporary local
            # clone of this commit before updating the public tap.
            brew tap sim-relay-ci/validate "file://$PWD"
            trap 'brew untap sim-relay-ci/validate' EXIT
            brew info --json=v2 --cask sim-relay-ci/validate/sim-relay
            git push origin "HEAD:$DEFAULT_BRANCH"
          fi
